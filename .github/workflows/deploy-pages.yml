name: Deploy zMinutes PWA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build:editor
      - run: npm run test:browser

      - name: Preserve browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-failure-evidence
          path: test-results/
          retention-days: 7

      - name: Prepare static PWA files
        shell: bash
        run: |
          mkdir _site
          cp zminutes-personal-store.js zminutes-personal.js zminutes-personal-export.js _site/
          cp index.html styles.css zminutes-tokens.css zminutes-layout.css zminutes-v2.css zminutes-ui.css zminutes-model.js zminutes-repository.js zminutes-app.js zminutes-feedback.js zminutes-views.js zminutes-editor.bundle.js zminutes-rich-notes.js zminutes-capture.js zminutes-audio.js zminutes-intelligence.js zminutes-live.js zminutes-exports.js zminutes-sync.js zminutes-recovery.js zminutes-reminders.js zminutes-pwa.js sw.js manifest.webmanifest zminutes-icon.svg zminutes-icon-192.png zminutes-icon-512.png _site/
          touch _site/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
