name: Deploy zMinutes PWA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Prepare static PWA files
        shell: bash
        run: |
          mkdir _site
          cp index.html styles.css app.js zminutes-storage.js zminutes-workflows.js zminutes-recorder.js zminutes-recorder-worklet.js zminutes-ai.js zminutes-drive.js sw.js manifest.webmanifest zminutes-icon.svg zminutes-icon-192.png zminutes-icon-512.png _site/
          touch _site/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
