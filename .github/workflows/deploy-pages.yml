name: Deploy zMinutes PWA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser

      - name: Prepare static PWA files
        shell: bash
        run: |
          mkdir _site
          cp index.html styles.css zminutes-v2.css zminutes-model.js zminutes-repository.js zminutes-app.js zminutes-views.js zminutes-capture.js zminutes-audio.js zminutes-intelligence.js zminutes-exports.js zminutes-sync.js zminutes-recovery.js zminutes-reminders.js zminutes-pwa.js zminutes-recorder.js zminutes-recorder-worklet.js sw.js manifest.webmanifest zminutes-icon.svg zminutes-icon-192.png zminutes-icon-512.png _site/
          touch _site/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
