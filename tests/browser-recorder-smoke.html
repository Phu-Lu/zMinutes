<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>zMinutes audio engine smoke test</title>
<button id="run">Run synthetic audio test</button>
<output id="result">Not started</output>
<script src="../zminutes-recorder.js?v=18"></script>
<script>
document.querySelector('#run').onclick = async () => {
  const result = document.querySelector('#result');
  result.textContent = 'Starting…';
  try {
    const context = new AudioContext();
    const oscillator = context.createOscillator();
    const destination = context.createMediaStreamDestination();
    oscillator.connect(destination);
    oscillator.start();
    const recorder = new ZMinutesPcmRecorder(destination.stream, context);
    await recorder.start();
    result.textContent = 'Recording…';
    await new Promise(resolve => setTimeout(resolve, 300));
    const blob = await recorder.stop();
    oscillator.stop();
    const bytes = new DataView(await blob.arrayBuffer());
    result.textContent = bytes.getUint32(24, true) === 16000 && blob.size > 44
      ? `PASS: ${blob.size} bytes, WAV at 16 kHz`
      : `FAIL: invalid WAV (${blob.size} bytes)`;
  } catch (error) {
    result.textContent = `FAIL: ${error.name}: ${error.message}`;
  }
};
</script>
</html>
